<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin de fotos — Manifiesto Ediciones</title>
<style>
  :root {
    --bg: #F1F0EC; --surface: #FFFFFF; --surface-2: #EDEAE1;
    --line: #D8D2C4; --text: #0B0D0C; --text-secondary: #3A332C; --text-muted: #7D7468;
    --brass: #8A6A2E; --burgundy: #6B0504; --burgundy-hover: #8C0E0A; --on-burgundy: #F1F0EC;
    --hidden-c: #6b6355; --delete-c: #8C0E0A; --reviewed-c: #2f6b3a;
    --font-display: 'Georgia', serif;
    --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-ui); background: var(--bg); color: var(--text); }
  #pin-gate { position: fixed; inset: 0; background: linear-gradient(135deg, #6B0504 0%, #3A0402 100%); display: flex; align-items: center; justify-content: center; z-index: 99999; font-family: Georgia, serif; }
  #pin-gate .box { background: #F1F0EC; padding: 2.2rem 2.4rem; border-radius: 10px; text-align: center; width: 280px; }
  #pin-gate p { font-size: 12px; color: #7D7468; margin: 0 0 16px 0; }
  #pin-gate input { width: 100%; padding: 0.7rem; font-size: 1.4rem; text-align: center; letter-spacing: 0.3em; border: 1px solid #DED7C6; border-radius: 6px; margin-bottom: 0.8rem; }
  #pin-gate button { width: 100%; padding: 0.7rem; background: #6B0504; color: #F1F0EC; border: none; border-radius: 6px; font-size: 0.95rem; cursor: pointer; }
  #pin-gate .err { color: #8C0E0A; font-size: 0.8rem; margin-top: 0.5rem; min-height: 1em; }

  header { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding: 0.9rem 1.2rem; display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: center; }
  header h1 { font-family: var(--font-display); font-size: 1.15rem; margin: 0; font-weight: 600; }
  header h1 a { color: inherit; text-decoration: none; }
  .stats { display: flex; gap: 0.9rem; font-size: 0.78rem; color: var(--text-muted); flex-wrap: wrap; }
  .stats b { color: var(--text); }
  .spacer { flex: 1; }
  .btn { font-family: var(--font-ui); font-size: 0.78rem; padding: 0.45rem 0.85rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--line); }
  .btn.primary { background: var(--burgundy); color: var(--on-burgundy); border-color: var(--burgundy); }
  .btn.primary:hover { background: var(--burgundy-hover); }
  .btn.danger { color: var(--delete-c); border-color: var(--delete-c); background: transparent; }
  .btn.danger:hover { background: rgba(140,14,10,0.08); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; padding: 0.8rem 1.2rem; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 57px; z-index: 19; }
  .toolbar input[type=search] { padding: 0.5rem 0.8rem; border: 1px solid var(--line); border-radius: 999px; font-size: 0.85rem; width: 220px; font-family: var(--font-ui); }
  .toolbar select { padding: 0.5rem 0.6rem; border: 1px solid var(--line); border-radius: 999px; font-size: 0.8rem; font-family: var(--font-ui); background: var(--surface); }
  .chip-filter { font-size: 0.78rem; padding: 0.4rem 0.75rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
  .chip-filter.is-active { background: var(--burgundy); color: var(--on-burgundy); border-color: var(--burgundy); }
  .chip-filter .c { opacity: 0.7; margin-left: 0.25rem; font-size: 0.72rem; }

  main { padding: 1.2rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.7rem; }
  .card { position: relative; border-radius: 8px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); cursor: pointer; transition: transform 0.1s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,0.12); }
  .card img { width: 100%; height: 130px; object-fit: cover; display: block; background: var(--surface-2); }
  .card .meta { padding: 0.4rem 0.5rem; font-size: 0.68rem; color: var(--text-muted); }
  .card .people-line { font-size: 0.68rem; color: var(--text-secondary); padding: 0 0.5rem 0.45rem; min-height: 1.1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .badges { position: absolute; top: 0.35rem; right: 0.35rem; display: flex; gap: 0.25rem; }
  .badge { font-size: 0.85rem; background: rgba(0,0,0,0.55); border-radius: 999px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
  .card.is-hidden { opacity: 0.55; }
  .card.is-deleted::after { content: ''; position: absolute; inset: 0; border: 3px solid var(--delete-c); border-radius: 8px; pointer-events: none; }
  .card.is-reviewed { box-shadow: inset 0 0 0 2px var(--reviewed-c); }
  .card .no-people { color: var(--delete-c); font-style: italic; }

  .load-more { display: block; margin: 1.4rem auto; }

  #overlay { position: fixed; inset: 0; background: rgba(11,13,12,0.7); display: none; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
  #overlay.is-open { display: flex; }
  #detail { background: var(--surface); border-radius: 12px; max-width: 920px; width: 100%; max-height: 94vh; overflow-y: auto; display: grid; grid-template-columns: 1fr 320px; }
  @media (max-width: 760px) { #detail { grid-template-columns: 1fr; } }
  #detail .img-side { background: #14100d; display: flex; align-items: center; justify-content: center; position: relative; min-height: 280px; }
  #detail .img-side img { max-width: 100%; max-height: 82vh; object-fit: contain; }
  #detail .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.85); border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 1rem; cursor: pointer; }
  #detail .nav-prev { left: 0.5rem; } #detail .nav-next { right: 0.5rem; }
  #detail .panel { padding: 1.1rem; display: flex; flex-direction: column; gap: 0.9rem; }
  #detail .close { position: absolute; top: 0.6rem; right: 0.6rem; background: rgba(0,0,0,0.5); color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 0.95rem; z-index: 5; }
  #detail h2 { font-family: var(--font-display); font-size: 1rem; margin: 0; }
  #detail .date { font-size: 0.75rem; color: var(--text-muted); }
  #detail .section-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.35rem; }
  .people-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .p-chip { display: inline-flex; align-items: center; gap: 0.3rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 0.25rem 0.4rem 0.25rem 0.7rem; font-size: 0.78rem; }
  .p-chip button { border: none; background: transparent; cursor: pointer; color: var(--delete-c); font-size: 0.85rem; line-height: 1; padding: 0.1rem; }
  .add-person { position: relative; }
  .add-person input { width: 100%; padding: 0.5rem 0.7rem; border: 1px solid var(--line); border-radius: 6px; font-size: 0.85rem; font-family: var(--font-ui); }
  .autocomplete { position: absolute; top: 100%; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; max-height: 180px; overflow-y: auto; z-index: 10; box-shadow: 0 6px 16px rgba(0,0,0,0.15); display: none; }
  .autocomplete.is-open { display: block; }
  .autocomplete div { padding: 0.45rem 0.7rem; font-size: 0.82rem; cursor: pointer; }
  .autocomplete div:hover, .autocomplete div.is-active { background: var(--surface-2); }
  .autocomplete .new-name { color: var(--brass); font-style: italic; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; padding: 0.5rem 0.7rem; border: 1px solid var(--line); border-radius: 8px; }
  .switch { position: relative; width: 38px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--line); border-radius: 999px; cursor: pointer; transition: 0.15s; }
  .slider::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: 0.15s; }
  input:checked + .slider { background: var(--burgundy); }
  input:checked + .slider::before { transform: translateX(16px); }
  .kbd-hint { font-size: 0.68rem; color: var(--text-muted); line-height: 1.5; }
  .kbd-hint kbd { background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; padding: 0.05rem 0.3rem; font-family: var(--font-ui); }
  .panel-actions { margin-top: auto; display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .panel-actions .btn { flex: 1; }

  #toast { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: #fff; padding: 0.6rem 1rem; border-radius: 999px; font-size: 0.8rem; opacity: 0; transition: 0.2s; pointer-events: none; z-index: 200; }
  #toast.is-shown { opacity: 1; transform: translateX(-50%) translateY(0); }
  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
</style>
</head>
<body>

<div id="pin-gate">
  <div class="box">
    <p>Introduce el PIN</p>
    <input type="password" id="pin-input" inputmode="numeric" maxlength="12" autofocus>
    <button type="button" id="pin-submit">Entrar</button>
    <div class="err" id="pin-error"></div>
  </div>
</div>
<script>
(function(){var PIN='240127',KEY='manifiestoPocUnlocked',g=document.getElementById('pin-gate'),i=document.getElementById('pin-input'),s=document.getElementById('pin-submit'),e=document.getElementById('pin-error');if(sessionStorage.getItem(KEY)==='1'){g.remove();return;}document.documentElement.style.overflow='hidden';setTimeout(function(){i.focus();},80);function c(){if(i.value===PIN){sessionStorage.setItem(KEY,'1');g.style.transition='opacity 0.3s';g.style.opacity='0';document.documentElement.style.overflow='';setTimeout(function(){g.remove();},320);}else{e.textContent='PIN incorrecto';i.value='';i.style.borderColor='#8C0E0A';setTimeout(function(){i.style.borderColor='#DED7C6';},1200);}}s.addEventListener('click',c);i.addEventListener('keydown',function(ev){if(ev.key==='Enter')c();});})();
</script>

<header>
  <h1><a href="../index.html">Manifiesto Ediciones</a> — Admin de fotos</h1>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <button type="button" class="btn" id="btnImport">Importar cambios</button>
  <input type="file" id="fileImport" accept="application/json" style="display:none">
  <button type="button" class="btn primary" id="btnExport">Exportar cambios</button>
  <button type="button" class="btn danger" id="btnReset">Descartar todo</button>
</header>

<div class="toolbar">
  <input type="search" id="search" placeholder="Buscar por persona o título…">
  <select id="personFilter"><option value="">Filtrar por persona…</option></select>
  <button type="button" class="chip-filter" data-filter="all">Todas</button>
  <button type="button" class="chip-filter" data-filter="unidentified">Sin personas</button>
  <button type="button" class="chip-filter" data-filter="unreviewed">Sin revisar</button>
  <button type="button" class="chip-filter" data-filter="reviewed">Revisadas</button>
  <button type="button" class="chip-filter" data-filter="hidden">Ocultas</button>
  <button type="button" class="chip-filter" data-filter="deleted">Para borrar</button>
  <button type="button" class="chip-filter" data-filter="edited">Con cambios</button>
</div>

<main>
  <div class="grid" id="grid"></div>
  <button type="button" class="btn load-more" id="loadMore" style="display:none;">Mostrar más</button>
</main>

<div id="overlay">
  <div id="detail"></div>
</div>

<script>
(function () {
  'use strict';
  var DATA = JSON.parse(document.getElementById('photo-data').textContent);
  var PHOTOS = DATA.photos;
  var ROSTER = DATA.roster;
  var BY_ID = {};
  PHOTOS.forEach(function (p) { BY_ID[p.id] = p; });

  var STORAGE_KEY = 'manifiesto_photo_edits_v1';
  var edits = {};
  try { edits = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (e) { edits = {}; }

  function sameList(a, b) {
    var aa = (a || []).slice().sort(), bb = (b || []).slice().sort();
    return JSON.stringify(aa) === JSON.stringify(bb);
  }

  function effective(photo) {
    var e = edits[photo.id] || {};
    return {
      people: e.people !== undefined ? e.people : photo.people,
      hidden: !!e.hidden,
      deleted: !!e.deleted,
      reviewed: !!e.reviewed
    };
  }

  function isEdited(photo) {
    var e = edits[photo.id];
    if (!e) return false;
    var peopleChanged = e.people !== undefined && !sameList(e.people, photo.people);
    return peopleChanged || !!e.hidden || !!e.deleted;
  }

  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(edits));
    updateStats();
  }

  function setEdit(id, patch) {
    var photo = BY_ID[id];
    var cur = edits[id] || {};
    var next = Object.assign({}, cur, patch);
    // clean up: drop 'people' if reverted to original
    if (next.people !== undefined && sameList(next.people, photo.people)) delete next.people;
    // drop empty entry entirely if nothing meaningfully set
    var hasContent = next.people !== undefined || next.hidden || next.deleted || next.reviewed;
    if (hasContent) edits[id] = next; else delete edits[id];
    persist();
  }

  function addPerson(id, name) {
    name = name.trim();
    if (!name) return;
    var photo = BY_ID[id];
    var cur = effective(photo).people.slice();
    if (cur.indexOf(name) === -1) cur.push(name);
    if (ROSTER.indexOf(name) === -1) ROSTER.push(name), ROSTER.sort(), populatePersonFilter();
    setEdit(id, { people: cur, reviewed: true });
  }
  function removePerson(id, name) {
    var photo = BY_ID[id];
    var cur = effective(photo).people.filter(function (p) { return p !== name; });
    setEdit(id, { people: cur, reviewed: true });
  }
  function toggleHidden(id) {
    var cur = effective(BY_ID[id]);
    setEdit(id, { hidden: !cur.hidden, reviewed: true });
  }
  function toggleDeleted(id) {
    var cur = effective(BY_ID[id]);
    setEdit(id, { deleted: !cur.deleted, reviewed: true });
  }
  function toggleReviewed(id) {
    var cur = effective(BY_ID[id]);
    setEdit(id, { reviewed: !cur.reviewed });
  }

  var state = { query: '', filter: 'all', person: '', visibleCount: 90 };
  var PAGE = 90;
  var currentList = [];
  var currentIndex = -1;

  function matches(photo) {
    var eff = effective(photo);
    var q = state.query.trim().toLowerCase();
    if (q) {
      var hay = (photo.title + ' ' + eff.people.join(' ')).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    if (state.person && eff.people.indexOf(state.person) === -1) return false;
    switch (state.filter) {
      case 'unidentified': return eff.people.length === 0;
      case 'unreviewed': return !eff.reviewed;
      case 'reviewed': return eff.reviewed;
      case 'hidden': return eff.hidden;
      case 'deleted': return eff.deleted;
      case 'edited': return isEdited(photo);
      default: return true;
    }
  }

  function populatePersonFilter() {
    var sel = document.getElementById('personFilter');
    var cur = sel.value;
    sel.innerHTML = '<option value="">Filtrar por persona…</option>' +
      ROSTER.map(function (p) { return '<option value="' + p + '">' + p + '</option>'; }).join('');
    sel.value = cur;
  }

  function updateStats() {
    var total = PHOTOS.length, reviewed = 0, hidden = 0, deleted = 0, edited = 0, unidentified = 0;
    PHOTOS.forEach(function (p) {
      var e = effective(p);
      if (e.reviewed) reviewed++;
      if (e.hidden) hidden++;
      if (e.deleted) deleted++;
      if (isEdited(p)) edited++;
      if (e.people.length === 0) unidentified++;
    });
    document.getElementById('stats').innerHTML =
      '<span><b>' + reviewed + '</b> / ' + total + ' revisadas</span>' +
      '<span><b>' + unidentified + '</b> sin personas</span>' +
      '<span><b>' + hidden + '</b> ocultas</span>' +
      '<span><b>' + deleted + '</b> para borrar</span>' +
      '<span><b>' + edited + '</b> con cambios sin exportar</span>';
  }

  function render() {
    currentList = PHOTOS.filter(matches);
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    if (!currentList.length) {
      grid.innerHTML = '<div class="empty-state">No hay fotos que coincidan con este filtro.</div>';
      document.getElementById('loadMore').style.display = 'none';
      return;
    }
    var page = currentList.slice(0, state.visibleCount);
    page.forEach(function (photo) {
      var eff = effective(photo);
      var card = document.createElement('div');
      card.className = 'card' + (eff.hidden ? ' is-hidden' : '') + (eff.deleted ? ' is-deleted' : '') + (eff.reviewed ? ' is-reviewed' : '');
      var badges = '';
      if (eff.hidden) badges += '<span class="badge" title="Oculta">🙈</span>';
      if (eff.deleted) badges += '<span class="badge" title="Marcada para borrar">🗑️</span>';
      var peopleTxt = eff.people.length ? eff.people.join(', ') : '<span class="no-people">Sin personas</span>';
      card.innerHTML =
        '<div class="badges">' + badges + '</div>' +
        '<img src="../' + photo.src + '" loading="lazy" alt="">' +
        '<div class="people-line">' + peopleTxt + '</div>' +
        '<div class="meta">' + (photo.date || '') + '</div>';
      card.addEventListener('click', function () { openDetail(photo.id); });
      grid.appendChild(card);
    });
    document.getElementById('loadMore').style.display = currentList.length > page.length ? 'block' : 'none';
    updateStats();
  }

  document.getElementById('loadMore').addEventListener('click', function () {
    state.visibleCount += PAGE; render();
  });
  document.getElementById('search').addEventListener('input', function (e) {
    state.query = e.target.value; state.visibleCount = PAGE; render();
  });
  document.getElementById('personFilter').addEventListener('change', function (e) {
    state.person = e.target.value; state.visibleCount = PAGE; render();
  });
  document.querySelectorAll('.chip-filter').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.chip-filter').forEach(function (x) { x.classList.remove('is-active'); });
      b.classList.add('is-active');
      state.filter = b.getAttribute('data-filter'); state.visibleCount = PAGE; render();
    });
  });
  document.querySelector('.chip-filter[data-filter="all"]').classList.add('is-active');

  var toastTimer;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('is-shown');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('is-shown'); }, 1800);
  }

  function openDetail(id) {
    currentIndex = currentList.findIndex(function (p) { return p.id === id; });
    renderDetail();
    document.getElementById('overlay').classList.add('is-open');
  }
  function closeDetail() { document.getElementById('overlay').classList.remove('is-open'); render(); }
  function step(dir) {
    var next = currentIndex + dir;
    if (next < 0 || next >= currentList.length) return;
    currentIndex = next; renderDetail();
  }

  function renderDetail() {
    var photo = currentList[currentIndex];
    var eff = effective(photo);
    var detail = document.getElementById('detail');
    var chipsHtml = eff.people.map(function (p) {
      return '<span class="p-chip">' + p + '<button type="button" data-remove="' + p.replace(/"/g,'&quot;') + '">✕</button></span>';
    }).join('') || '<span style="color:var(--text-muted);font-size:0.8rem;">Nadie identificado todavía</span>';

    detail.innerHTML =
      '<div class="img-side">' +
        '<button type="button" class="nav-btn nav-prev" id="navPrev" ' + (currentIndex <= 0 ? 'disabled' : '') + '>‹</button>' +
        '<img src="../' + photo.src + '" alt="">' +
        '<button type="button" class="nav-btn nav-next" id="navNext" ' + (currentIndex >= currentList.length - 1 ? 'disabled' : '') + '>›</button>' +
      '</div>' +
      '<div class="panel">' +
        '<button type="button" class="close" id="closeDetail">✕</button>' +
        '<div><h2>' + (photo.title || photo.id) + '</h2><div class="date">' + (photo.date || '') + '</div></div>' +
        '<div>' +
          '<div class="section-label">Personas (' + (currentIndex+1) + ' de ' + currentList.length + ')</div>' +
          '<div class="people-chips" id="peopleChips">' + chipsHtml + '</div>' +
        '</div>' +
        '<div class="add-person">' +
          '<input type="text" id="addPersonInput" placeholder="Agregar persona… (busca o escribe un nombre nuevo)" autocomplete="off">' +
          '<div class="autocomplete" id="autocomplete"></div>' +
        '</div>' +
        '<div class="toggle-row"><span>👁️‍🗨️ Ocultar (no la ve la familia)</span><label class="switch"><input type="checkbox" id="toggleHidden" ' + (eff.hidden?'checked':'') + '><span class="slider"></span></label></div>' +
        '<div class="toggle-row"><span>🗑️ Marcar para borrar<br><small style="color:var(--text-muted);font-weight:400;">Desaparece del sitio. El archivo original del proyecto nunca se borra.</small></span><label class="switch"><input type="checkbox" id="toggleDeleted" ' + (eff.deleted?'checked':'') + '><span class="slider"></span></label></div>' +
        '<div class="toggle-row"><span>✓ Revisada</span><label class="switch"><input type="checkbox" id="toggleReviewed" ' + (eff.reviewed?'checked':'') + '><span class="slider"></span></label></div>' +
        '<div class="kbd-hint">' +
          '<kbd>←</kbd>/<kbd>→</kbd> foto anterior/siguiente · <kbd>H</kbd> ocultar · <kbd>D</kbd> borrar · <kbd>R</kbd> revisada · <kbd>Esc</kbd> cerrar' +
        '</div>' +
        '<div class="panel-actions">' +
          '<a class="btn" href="editor.html?photo=' + encodeURIComponent(photo.id) + '" target="_blank">✂️ Editar imagen (crop/rotar)</a>' +
        '</div>' +
        '<div style="font-size:0.68rem;color:var(--text-muted);">Nada de esto se aplica al sitio al instante — exporta el JSON con el botón de arriba y pásaselo a Claude para publicarlo.</div>' +
      '</div>';

    document.getElementById('closeDetail').addEventListener('click', closeDetail);
    var pv = document.getElementById('navPrev'); if (pv) pv.addEventListener('click', function(){ step(-1); });
    var nx = document.getElementById('navNext'); if (nx) nx.addEventListener('click', function(){ step(1); });
    detail.querySelectorAll('[data-remove]').forEach(function (b) {
      b.addEventListener('click', function () { removePerson(photo.id, b.getAttribute('data-remove')); renderDetail(); });
    });
    document.getElementById('toggleHidden').addEventListener('change', function (e) { setEdit(photo.id, { hidden: e.target.checked, reviewed: true }); });
    document.getElementById('toggleDeleted').addEventListener('change', function (e) { setEdit(photo.id, { deleted: e.target.checked, reviewed: true }); });
    document.getElementById('toggleReviewed').addEventListener('change', function (e) { setEdit(photo.id, { reviewed: e.target.checked }); });

    var input = document.getElementById('addPersonInput');
    var ac = document.getElementById('autocomplete');
    input.addEventListener('input', function () {
      var q = input.value.trim().toLowerCase();
      if (!q) { ac.classList.remove('is-open'); return; }
      var current = effective(photo).people;
      var matches = ROSTER.filter(function (n) { return n.toLowerCase().indexOf(q) > -1 && current.indexOf(n) === -1; }).slice(0, 8);
      var html = matches.map(function (n) { return '<div data-name="' + n.replace(/"/g,'&quot;') + '">' + n + '</div>'; }).join('');
      var exact = ROSTER.some(function (n) { return n.toLowerCase() === q; });
      if (!exact) html += '<div class="new-name" data-name="' + input.value.trim().replace(/"/g,'&quot;') + '">➕ Agregar "' + input.value.trim() + '" como persona nueva</div>';
      ac.innerHTML = html;
      ac.classList.toggle('is-open', html.length > 0);
    });
    ac.addEventListener('click', function (e) {
      var name = e.target.getAttribute('data-name');
      if (!name) return;
      addPerson(photo.id, name);
      input.value = ''; ac.classList.remove('is-open');
      renderDetail();
      document.getElementById('addPersonInput').focus();
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var first = ac.querySelector('div');
        if (first) { addPerson(photo.id, first.getAttribute('data-name')); input.value = ''; ac.classList.remove('is-open'); renderDetail(); document.getElementById('addPersonInput').focus(); }
      } else if (e.key === 'Escape') { ac.classList.remove('is-open'); }
    });
  }

  document.getElementById('overlay').addEventListener('click', function (e) { if (e.target === this) closeDetail(); });
  document.addEventListener('keydown', function (e) {
    if (!document.getElementById('overlay').classList.contains('is-open')) return;
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input') return;
    if (e.key === 'Escape') closeDetail();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key.toLowerCase() === 'h') { var cb=document.getElementById('toggleHidden'); cb.checked=!cb.checked; cb.dispatchEvent(new Event('change')); }
    else if (e.key.toLowerCase() === 'd') { var cb2=document.getElementById('toggleDeleted'); cb2.checked=!cb2.checked; cb2.dispatchEvent(new Event('change')); }
    else if (e.key.toLowerCase() === 'r') { var cb3=document.getElementById('toggleReviewed'); cb3.checked=!cb3.checked; cb3.dispatchEvent(new Event('change')); }
  });

  document.getElementById('btnExport').addEventListener('click', function () {
    var out = { exportedAt: new Date().toISOString(), edits: edits };
    var blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'photo-edits-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    showToast('Descargado. Pásaselo a Claude para aplicarlo al sitio.');
  });
  document.getElementById('btnImport').addEventListener('click', function () { document.getElementById('fileImport').click(); });
  document.getElementById('fileImport').addEventListener('change', function (e) {
    var file = e.target.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        var incoming = parsed.edits || parsed;
        edits = Object.assign({}, edits, incoming);
        persist(); render();
        showToast('Cambios importados y fusionados con los actuales.');
      } catch (err) { showToast('Ese archivo no es un JSON válido de esta herramienta.'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  });
  document.getElementById('btnReset').addEventListener('click', function () {
    if (!confirm('¿Descartar TODOS los cambios sin exportar? Esto no se puede deshacer.')) return;
    edits = {}; persist(); render();
    showToast('Cambios descartados.');
  });

  populatePersonFilter();
  render();
})();
</script>
</body>
</html>
